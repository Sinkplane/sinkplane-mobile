name: CI

# Every job below is a required status check on main (see README "Quality gates" for the ruleset).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  # Lets GITHUB_TOKEN read @sinkplane/shared from GitHub Packages (see .github/actions/setup).
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: format, lint, typecheck, arch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Format (prettier --check)
        run: make fmt-check
      - name: Lint (eslint --max-warnings=0, knip)
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Architecture (dependency-cruiser)
        run: make arch

  test:
    name: tests, coverage, crap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Unit + E2E with coverage thresholds
        run: make coverage
      - name: CRAP (per-function complexity x coverage)
        run: make crap
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  bundle:
    name: bundle (iOS + Android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Metro export
        run: make build

  mutation:
    name: mutation (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.PACKAGES_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      # PRs mutate only src files changed vs the base branch; pushes to main have nothing to diff.
      - name: Stryker
        if: github.event_name == 'pull_request'
        run: make mutate SCOPE=changed BASE=origin/${{ github.base_ref }}
      - name: Upload mutation report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
