<!doctype html>
<!--
  Demo-mode artwork (store/demo/make-media.sh renders it). Open with a hash naming one asset:
    #thumb/<video slug>  1280x720 video thumbnail
    #icon/<name>         512x512 creator icon or user avatar
    #live/<creator>      1280x720 live thumbnail  (#live/<creator>-offline: offline card)
    #scene/<name>        1280x720 frame the demo HLS streams are made from
  Everything is drawn here (shapes and system fonts): no third-party images or content.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      .canvas {
        position: relative;
        overflow: hidden;
        font-family: 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      .wide {
        width: 1280px;
        height: 720px;
      }
      .square {
        width: 512px;
        height: 512px;
      }
      svg {
        position: absolute;
        inset: 0;
      }
      .headline {
        position: absolute;
        left: 64px;
        top: 50%;
        transform: translateY(-50%);
        width: 560px;
        font-family: 'Avenir Next Condensed', 'Avenir Next', 'Helvetica Neue', sans-serif;
        font-weight: 800;
        font-size: 112px;
        line-height: 0.95;
        letter-spacing: -1px;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
      }
      .headline em {
        font-style: normal;
        display: inline-block;
        padding: 0 14px;
        margin-top: 10px;
        border-radius: 10px;
        color: var(--ink);
        background: var(--accent);
        text-shadow: none;
      }
      .initials {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 220px;
        color: #fff;
        letter-spacing: -6px;
      }
      .offline {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 96px;
        text-align: center;
        font-weight: 700;
        font-size: 64px;
        color: #fff;
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
      }
      .offline small {
        display: block;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 6px;
        text-transform: uppercase;
        opacity: 0.75;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const PALETTES = {
        'bench-notes': { bg1: '#0b2236', bg2: '#16618f', accent: '#ffb43b', ink: '#1b1205' },
        'slow-kitchen': { bg1: '#4e170d', bg2: '#c4532f', accent: '#ffe2a8', ink: '#3a1408' },
        'night-signal': { bg1: '#120930', bg2: '#5b1f8a', accent: '#4ef0ff', ink: '#0b0620' },
        'trail-log': { bg1: '#0c2416', bg2: '#2f7a45', accent: '#ffb04a', ink: '#1d1205' },

      // -- shape helpers (600x600 motif boxes) ------------------------------------------
      const rect = (x, y, w, h, fill, rx = 0, extra = '') =>
        `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" ${extra}/>`;
      const circle = (cx, cy, r, fill, extra = '') =>
        `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" ${extra}/>`;
      const path = (d, fill, extra = '') => `<path d="${d}" fill="${fill}" ${extra}/>`;
      const line = (x1, y1, x2, y2, stroke, w = 6) =>
        `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round"/>`;
      const range = (n) => Array.from({ length: n }, (_, i) => i);
      const shadow = 'filter="url(#drop)"';

      const knob = (cx, cy, r, color) =>
        circle(cx, cy, r, color) +
        circle(cx, cy, r * 0.62, '#11161c') +
        line(cx, cy, cx + r * 0.45, cy - r * 0.45, '#fff', 4);

      // -- motifs ----------------------------------------------------------------------------

        synth: (p) => {
          const whites = range(14).map((i) => rect(44 + i * 37, 300, 33, 140, '#f5f1e8', 5));

            .filter((i) => [0, 1, 3, 4, 5].includes(i % 7))
            .map((i) => rect(66 + i * 37, 300, 22, 86, '#11161c', 3));

            knob(78 + i * 82, 238, 24, i % 2 ? '#d9dee5' : p.accent),

            ${rect(20, 190, 560, 96, '#303a46', 26)}
            ${rect(36, 290, 528, 158, '#0d1116', 8)}

        },
        charger: (p) => `<g ${shadow}>
            <path d="M210 330 C 210 470, 420 470, 440 380 S 520 250, 470 200" stroke="#e9edf2" stroke-width="22" fill="none" stroke-linecap="round"/>

            ${rect(440, 150, 70, 70, '#d5dbe2', 16)}${rect(456, 120, 38, 40, '#9aa4b0', 10)}

        crt: (p) => `<g ${shadow}>

        field: (p) => `<g ${shadow}>

        modular: (p) => `<g ${shadow}>

          `<g>${range(15)
            .map((i) => {
              const h = 40 + Math.abs(Math.sin(i * 0.75 + 0.4)) * 300;
              return rect(110 + i * 26, 300 - h / 2, 14, h, i % 4 === 1 ? '#ff4fa3' : p.accent, 7);
            })
            .join('')}</g>`,
        mountain: (p) =>
          `<g>${circle(390, 210, 60, p.accent)}${path('M90 440 l150 -230 l70 100 l60 -70 l140 200 z', '#f4f6f9')}${path('M240 210 l38 58 l-32 -12 l-24 24 l-26 -14 z', '#cfd8d2')}</g>`,
      };

      // -- catalog (kept in step with jest/demo/catalog.ts) ------------------------------------
      const THUMBS = {
        'synth-rebuild': ['bench-notes', 'synth', '$40 synth', 'rebuild'],
        'usb-chargers': ['bench-notes', 'charger', '3 of 9', 'failed'],
        'tv-capacitor': ['bench-notes', 'crt', 'the CRT', 'killer'],
        'quiet-pc': ['bench-notes', 'pc', 'zero', 'noise'],
        'worst-solder': ['bench-notes', 'solder', 'worst', 'solder?'],
        'thrift-amp': ['bench-notes', 'amp', 'thrift', 'rescue'],
        'smart-lock': ['bench-notes', 'lock', 'not so', 'smart'],
        pager: ['bench-notes', 'pager', 'inside', '1994'],
        speaker: ['bench-notes', 'speaker', "what's", 'inside?'],
        'cast-iron': ['slow-kitchen', 'skillet', 'myths', 'tested'],
        ramen: ['slow-kitchen', 'ramen', '20 min', 'ramen'],
        sourdough: ['slow-kitchen', 'bread', 'easy', 'sourdough'],
        'sheet-pan': ['slow-kitchen', 'sheetpan', 'one pan', '5 dinners'],
        'field-track': ['night-signal', 'field', 'one', 'sound'],
        'modular-basics': ['night-signal', 'modular', 'modular', '101'],
        'tape-loops': ['night-signal', 'cassette', 'tape', 'loops'],
        'coast-trail': ['trail-log', 'coast', '3 days', 'coastline'],
        ultralight: ['trail-log', 'backpack', 'ultra', 'light'],
        'altitude-cooking': ['trail-log', 'stove', 'cooking', 'up high'],
      };
      const CREATOR_GLYPH = {
        'bench-notes': 'chip',
        'slow-kitchen': 'pot',
        'night-signal': 'wave',
        'trail-log': 'mountain',
      };
      const PEOPLE = {
        alexkim: ['AK', '#3b82f6', '#8b5cf6'],
        maya_builds: ['M', '#f97316', '#ef4444'],
        retrowire: ['R', '#10b981', '#0ea5e9'],
        lowpass: ['L', '#ec4899', '#8b5cf6'],
        ohm_sweet_ohm: ['O', '#eab308', '#f97316'],
        'kj.solders': ['K', '#06b6d4', '#3b82f6'],
        'dana.fixes': ['D', '#84cc16', '#10b981'],
      };
      const OFFLINE = {
        'bench-notes': ['Bench Notes', 'Back Friday at 7pm'],
        'night-signal': ['Night Signal', 'Live most nights at 10pm'],
        'slow-kitchen': ['Slow Kitchen', 'Cook-along Sundays at noon'],
        'trail-log': ['Trail Log', 'Next Q&A after the trip'],
      };

      // -- composition -----------------------------------------------------------------------
      const defs = (p) => `<defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p.bg1}"/><stop offset="1" stop-color="${p.bg2}"/></linearGradient>
          <radialGradient id="crtglow" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#9ff7c1"/><stop offset="0.6" stop-color="#2fae6b"/><stop offset="1" stop-color="#0d3a22"/></radialGradient>
          <radialGradient id="glow" cx="0.72" cy="0.45" r="0.6"><stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/></filter>
        </defs>`;
      const backdrop = (p, w, h) =>
        `${rect(0, 0, w, h, 'url(#bg)')}${rect(0, 0, w, h, 'url(#glow)')}` +
        range(Math.ceil(w / 64))
          .map((i) => rect(i * 64, 0, 1, h, 'rgba(255,255,255,0.05)'))
          .join('') +
        range(Math.ceil(h / 64))
          .map((i) => rect(0, i * 64, w, 1, 'rgba(255,255,255,0.05)'))
          .join('');
      const motif = (name, p, x, y, size) =>
        `<svg x="${x}" y="${y}" width="${size}" height="${size}" viewBox="0 0 600 600" overflow="visible">${MOTIFS[name](p)}</svg>`;
      const wide = (svg, html = '') =>
        `<div class="canvas wide"><svg width="1280" height="720" viewBox="0 0 1280 720">${svg}</svg>${html}</div>`;
      const square = (svg, html = '') =>
        `<div class="canvas square"><svg width="512" height="512" viewBox="0 0 512 512">${svg}</svg>${html}</div>`;
      const vars = (p) => `style="--accent:${p.accent};--ink:${p.ink}"`;

      function thumb(slug) {
        const [creator, name, top, bottom] = THUMBS[slug];
        const p = PALETTES[creator];
        return wide(
          defs(p) + backdrop(p, 1280, 720) + motif(name, p, 640, 50, 620),
          `<div class="headline" ${vars(p)}>${top}<br/><em>${bottom}</em></div>`,
        );
      }

      function icon(name) {
        if (PEOPLE[name]) {
          const [letters, a, b] = PEOPLE[name];
          return square(
            `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>${rect(0, 0, 512, 512, 'url(#g)')}`,
            `<div class="initials">${letters}</div>`,
          );
        }
        const p = PALETTES[name];
        return square(
          defs(p) + rect(0, 0, 512, 512, 'url(#bg)') + motif(CREATOR_GLYPH[name], p, 26, 26, 460),
        );
      }

      function scene(name) {
        if (name === 'live' || name === 'night-signal') {
          const p = PALETTES['night-signal'];
          const beams = range(5)
            .map((i) =>
              path(
                `M${200 + i * 220} 0 L${100 + i * 240} 720 L${300 + i * 240} 720 Z`,
                i % 2 ? 'rgba(255,79,163,0.10)' : 'rgba(78,240,255,0.10)',
              ),
            )
            .join('');
          return wide(
            defs(p) +
              backdrop(p, 1280, 720) +
              beams +
              motif('modular', p, 140, 120, 520) +
              motif('wave', p, 640, 140, 520) +
              rect(0, 620, 1280, 100, 'rgba(0,0,0,0.35)'),
          );
        }
        const p = PALETTES['bench-notes'];
        return wide(
          defs(p) +
            rect(0, 0, 1280, 720, '#123047') +
            rect(0, 0, 1280, 720, 'url(#glow)') +
            path('M980 0 l-120 210 h240 z', 'rgba(255,214,140,0.25)') +
            rect(960, 0, 16, 60, '#2a2f36') +
            path('M900 60 h140 l-30 60 h-80 z', '#3a414b') +
            rect(0, 520, 1280, 200, '#6b4a30') +
            rect(0, 520, 1280, 18, '#82603f') +
            motif('synth', p, 200, 170, 620) +
            `<g transform="translate(860 300)">${rect(0, 0, 300, 230, '#2a2f36', 18)}${rect(20, 20, 200, 150, '#0b1a10', 8)}<path d="M30 95 ${range(
              19,
            )
              .map((i) => `L${40 + i * 9} ${95 + Math.sin(i * 0.9) * 40}`)
              .join(
                ' ',
              )}" stroke="#6dff9c" stroke-width="4" fill="none"/>${knob(260, 60, 18, '#d9dee5')}${knob(260, 130, 18, p.accent)}</g>`,
        );
      }

      function live(name) {
        const [creator, state] = name.endsWith('-offline')
          ? [name.slice(0, -8), 'offline']
          : [name, 'live'];
        if (state === 'live') {
          return scene(creator);
        }
        const p = PALETTES[creator];
        const [kicker, text] = OFFLINE[creator];
        return wide(
          defs(p) + backdrop(p, 1280, 720) + motif(CREATOR_GLYPH[creator], p, 490, 90, 300),
          `<div class="offline">${kicker ? `<small>${kicker}</small>` : ''}${text}</div>`,
        );
      }

      const RENDER = { thumb, icon, scene, live };
      const LIST = [
        ...Object.keys(THUMBS).map((s) => `thumb/${s} thumbs/${s}.jpg 1280 720`),
        ...[...Object.keys(PALETTES), ...Object.keys(PEOPLE)].map(
          (s) => `icon/${s} icons/${s}.png 512 512`,
        ),
        ...Object.keys(PALETTES).flatMap((s) => [
          `live/${s} live/${s}.jpg 1280 720`,
          `live/${s}-offline live/${s}-offline.jpg 1280 720`,
        ]),
        'scene/video scenes/video.png 1280 720',
        'scene/live scenes/live.png 1280 720',
      ];

      const [kind, name] = decodeURIComponent(location.hash.slice(1)).split('/');
      document.getElementById('root').innerHTML =
        kind === 'list' ? `<pre id="list">${LIST.join('\n')}</pre>` : RENDER[kind](name);
    </script>
  </body>
</html>
